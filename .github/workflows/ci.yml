name: ci

on:
  workflow_dispatch:      # Start a workflow
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Remove ~18 GiB of preinstalled software to have more disk space during the build
    - name: Cleanup runner
      run: |
        df -h
        sudo rm -rf /opt/microsoft /usr/local/.ghcup /usr/local/julia* /usr/share/dotnet /usr/share/swift /usr/lib/llvm*
        df -h

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: retro-go:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true

    - name: Build and Extract Firmware
      run: |
        mkdir -p build
        # 1. Запускаем сборку прошивки внутри контейнера
        docker run --rm -v $(pwd)/build:/build retro-go:latest sh -c "python3 rg_tool.py build && cp -r build/* /build/ 2>/dev/null || cp *.fw /build/ 2>/dev/null || true"
        
        # 2. Проверяем извлеченные файлы
        echo "=== Содержимое директории build ==="
        ls -la build/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: retro-go-esp32s3-firmware
        path: build/
