name: ci

on:
  workflow_dispatch:      # Start a workflow
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Remove ~18 GiB of preinstalled software to have more disk space during the build
    - name: Cleanup runner
      run: |
        df -h
        sudo rm -rf /opt/microsoft /usr/local/.ghcup /usr/local/julia* /usr/share/dotnet /usr/share/swift /usr/lib/llvm*
        df -h

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: retro-go:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true

    - name: Build and Extract Firmware
      run: |
        mkdir -p build_artifacts
        
        # Запускаем сборку и копируем результаты из всех возможных мест
        docker run --rm -v $(pwd)/build_artifacts:/out retro-go:latest sh -c "
          python3 rg_tool.py build || true
          find / -type f \( -name '*.fw' -o -name '*.bin' -o -name '*.zip' \) ! -path '*/.git/*' ! -path '*/idf/*' -exec cp {} /out/ \; 2>/dev/null || true
        "
        
        echo "=== Содержимое скопированных артефактов ==="
        ls -la build_artifacts/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: retro-go-firmware
        path: build_artifacts/
